name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: tag latest (stable versions only)
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create -t ghcr.io/bespex/hatrack:latest "ghcr.io/bespex/hatrack:$v"

      # The APT repository (bespex/apt) rebuilds on a schedule, but GitHub runs scheduled workflows
      # only every few hours: the release asks for a run at once. Needs the secret APT_DISPATCH_TOKEN
      # (fine-grained token for bespex/apt, Actions: read and write); without it the step is skipped
      # and the schedule picks the release up later.
      - name: Update the APT repository
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.APT_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "No APT_DISPATCH_TOKEN: the APT repository's schedule picks the release up later."
            exit 0
          fi
          gh workflow run publish.yml -R bespex/apt
